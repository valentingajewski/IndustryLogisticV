; LSOL runtime anchor file.
; Keep LSOL.dll and LSOL.ini directly under scripts/.
; Current LSOL builds load live XML content from scripts/LSOL/.
; Edit the control values below to change LSOL's main hotkeys.
; Valid examples: F8, F7, F9, E, B. Missing or invalid values fall back safely.
; BusDoors opens/closes the bus entry doors while seated in a stopped job bus;
; keep it off E (vehicle horn) and F (enter/exit vehicle).

[Runtime]
ContentRoot=LSOL
ConfigRoot=LSOL\LSOL_Config
AddonsRoot=LSOL\LSOL_Addons
SavesRoot=LSOL\LSOLSaves
StateFile=LSOL\LSOL.state.xml

[Controls]
ToggleDashboard=F8
OpenModMenu=F7
OpenDebugMenu=F9
Interact=E
BusDoors=B